deployment:
  replicas: 2

ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    tls:
      enabled: true

providers:
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: false
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false

securityContext:
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"
